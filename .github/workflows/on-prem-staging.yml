name: Deploy to Staging Server
on:
  push:
    branches: [staging]

jobs:
  deploy:
    name: Deploying to Staging Server
    runs-on: [ self-hosted, bidbox-vm ]
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          clean: False
      - name: Make environment files
        run: |
          cat << EOF > .env
            API_SECRET=${{ secrets.API_SECRET }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_DRIVER=${{ secrets.DB_DRIVER }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            ENCRYPTION_PASS=${{ secrets.ENCRYPTION_PASS }}

      - name: Building and Assigning Tag to image
        run: |
          docker build -t bidbox-accounts:latest .
          
      - name: Starting Docker Container
        run: |
          docker run -d -p 8000:8000 --name bidbox-accounts-service bidbox-accounts:latest 
      - name: View Docker status
        run: |
          docker ps
