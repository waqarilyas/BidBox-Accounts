      tags:
      - auth
  /admin/otp/validate:
    post:
      consumes:
      - application/json
      description: validate otp
      parameters:
      - description: otp input
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/admin.OTPInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.OtpValidResp'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Validate OTP
      tags:
      - auth
  /admin/otp/verify:
    post:
      consumes:
      - application/json
      description: verify otp
      parameters:
      - description: otp input
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/admin.OTPInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.OtpVerifyResp'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
