          $ref: '#/definitions/admin.RegisterUserInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            type: string
      summary: Sign Up Admin User
      tags:
      - auth
  /admin/timeframe:
    post:
      consumes:
      - application/json
      description: get timeframe
