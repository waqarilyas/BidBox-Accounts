basePath: /accounts
definitions:
  admin.ChangePasswordInput:
    properties:
      new_password:
        type: string
      password:
        type: string
    required:
    - new_password
    - password
    type: object
  admin.ChangeTimeframeInput:
    properties:
      timeframe:
        type: string
    required:
    - timeframe
    type: object
  admin.CoinPair:
    properties:
      active:
        example: true
        type: boolean
      coin:
        example: FTMUSDT
        type: string
      id:
        example: 25
        type: integer
      leverage:
        example: 80
        type: integer
    type: object
  admin.Conditions:
    properties:
      capital:
        example: 300
        type: integer
      leverage:
        example: 80
        type: integer
      positions:
        example: 2
        type: integer
      stop_loss:
        example: 80
        type: integer
      take_profit:
        example: 2
        type: integer
    type: object
  admin.LoginUserInput:
    properties:
      UserId:
        type: string
      email:
        type: string
      password:
        type: string
    required:
    - password
    type: object
  admin.OTPInput:
    properties:
      id:
        type: string
      token:
        type: string
    type: object
  admin.OTPResponse:
    properties:
      otp_enabled:
        type: string
    type: object
  admin.RegisterUserInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - name
    - password
    type: object
  admin.Resp:
    properties:
      email:
        type: string
      id:
        type: string
      otp_verified:
        type: boolean
    type: object
  controllers.ExchangeModel:
    properties:
      connected:
        type: boolean
      id:
        type: integer
      image_src:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      short:
        type: string
    type: object
  controllers.ExchangeResp:
    properties:
      api_key:
        type: string
      passphrase:
        type: string
      secret:
        type: string
    type: object
  controllers.GetConditionRes:
    properties:
      conditions:
        items:
          $ref: '#/definitions/admin.Conditions'
        type: array
      total:
        example: 999
        type: integer
    type: object
  controllers.ListingResp:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Statements'
        type: array
      msg:
        type: string
    type: object
  controllers.LoginResp:
    properties:
      email:
        type: string
      id:
        type: string
      jwt_token:
        type: string
      otp_verified:
        type: boolean
    type: object
  controllers.NoUsersResp:
    properties:
      active_trades:
        type: integer
      successful:
        type: integer
      transactions:
        type: integer
      users:
        type: integer
    type: object
  controllers.OtpGenResp:
    properties:
      base32:
        type: string
      otpauth_url:
        type: string
    type: object
  controllers.OtpValidResp:
    properties:
      otp_valid:
        type: boolean
    type: object
  controllers.OtpVerifyResp:
    properties:
      email:
        type: string
      id:
        type: string
      otp_verified:
        type: boolean
      token:
        type: string
    type: object
  controllers.TimeframeResp:
    properties:
      timeframe:
        type: string
    type: object
  controllers.UserBody:
    properties:
      password:
        example: "123"
        type: string
      username:
        example: admin
        type: string
    type: object
  controllers.UserSettingsResp:
    properties:
      auto_compound:
        type: boolean
      mode:
        type: string
      strategy:
        type: string
    type: object
  models.GroupedPosition:
    properties:
      hedgeID:
        type: string
      positions:
        items:
          $ref: '#/definitions/models.Position'
        type: array
    type: object
  models.Key:
    properties:
      api_key:
        description: |-
          Api Key
          example: 829sksh8jws9020wp
        type: string
      compound:
        description: |-
          Auto Compound
          example: true
        type: boolean
      key_id:
        description: |-
          ID of Key
          example: 9283939ede-829kskiisii2-kdeoidekeo2-ieodke9ese
        type: string
      mode:
        description: |-
          Mode
          example: conservative
        type: string
      passphrase:
        description: |-
          Passphrase
          example: thisisapassphrase
        type: string
      secret:
        description: |-
          Secret Key
          example: 7276shsjj299skwks93ls
        type: string
      service:
        description: |-
          Exchange of key
          example: bitget
        type: string
      start:
        description: |-
          Enable Key
          example: true
        type: boolean
      strategy:
        description: |-
          Strategy
          example: cycle
        type: string
      trade_amount:
        description: |-
          Trade Amount
          example: 200
        type: integer
      user_email:
        description: |-
          User Email
          example: abc@gmail.com
        type: string
    type: object
  models.Order:
    properties:
      created_at:
        type: string
      email:
        type: string
      fee:
        type: number
      id:
        type: string
      margin_coin:
        type: string
      order_id:
        type: string
      order_price:
        type: string
      order_type:
        type: string
      position_id:
        type: integer
      profit:
        type: number
      quote_amount:
        type: string
      service:
        type: string
      side:
        type: string
      size:
        type: string
      symbol:
        type: string
    type: object
  models.Position:
    properties:
      created_at:
        type: string
      exchange:
        type: string
      fee:
        type: number
      first_buy_amount:
        type: string
      hedge_id:
        type: string
      id:
        type: integer
      last_update_price:
        type: string
      layer:
        type: integer
      leverage:
        type: string
      liq_price:
        type: string
      margin:
        type: string
      mark_price:
        type: string
      open_price:
        type: string
      order_id:
        type: string
      side:
        type: string
      size:
        type: string
      status:
        type: string
      stop_loss:
        type: string
      symbol:
        type: string
      take_profit:
        type: string
      total_profit:
        type: number
      unrealized_pl:
        type: string
      updated_at:
        type: string
      user_email:
        type: string
    type: object
  models.Result:
    properties:
      profit:
        type: number
      symbol:
        type: string
    type: object
  models.Statements:
    properties:
      closed_pnl:
        type: number
      created_time:
        type: string
      exchange:
        type: string
      position_id:
        type: integer
      profit_usd:
        type: number
      quote_amount:
        type: number
      side:
        type: string
      size:
        type: number
      symbol:
        type: string
      updated_time:
        type: string
      user_email:
        type: string
    type: object
  models.User:
    properties:
      confirmed:
        type: boolean
      country:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      mode:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      strategy:
        type: string
      time_zone:
        type: string
      updated_at:
        type: string
      user_name:
        type: string
    type: object
host: stg-api-bidbox.kryptomind.net
info:
  contact:
    email: support@swagger.io
